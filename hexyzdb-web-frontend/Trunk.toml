trunk-version = "0.21.4"

[build]
minify = "on_release"

[[proxy]]
rewrite = "/backend/"
backend = "http://localhost:8081/"

[[hooks]]
stage   = "build"
command = "scripts/build-css.sh"

[[hooks]]
stage   = "build"
command = "scripts/build-static.sh"

[[hooks]]
stage   = "post_build"
command = "scripts/optimize-wasm.sh"
