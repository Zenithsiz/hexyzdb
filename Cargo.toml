[workspace]

members  = ["hexyzdb-web-backend", "hexyzdb-web-dto", "hexyzdb-web-frontend", "hexyzdb-web-frontend-static"]
resolver = "2"

[workspace.package]
authors      = ["Filipe Rodrigues <filipejacintorodrigues1@gmail.com>"]
license-file = "LICENSE-MIT"

[workspace.dependencies]

dhexyzf-build-data = { package = "build-data", path = "dhexyzf/rust/build-data" }

app-error                = "0.2.0"
axum                     = "0.8.9"
clap                     = "4.6.7"
console_error_panic_hook = "0.1.7"
derive_more              = "2.1.1"
dynatos-loadable         = { git = "https://github.com/Zenithsiz/dynatos", rev = "893df874887687559c12eba221b6ddf3f1430dba" }
dynatos-reactive         = { git = "https://github.com/Zenithsiz/dynatos", rev = "893df874887687559c12eba221b6ddf3f1430dba" }
dynatos-web              = { git = "https://github.com/Zenithsiz/dynatos", rev = "893df874887687559c12eba221b6ddf3f1430dba" }
dynatos-web-reactive     = { git = "https://github.com/Zenithsiz/dynatos", rev = "893df874887687559c12eba221b6ddf3f1430dba" }
dynatos-web-router       = { git = "https://github.com/Zenithsiz/dynatos", rev = "893df874887687559c12eba221b6ddf3f1430dba" }
dynatos-web-title        = { git = "https://github.com/Zenithsiz/dynatos", rev = "893df874887687559c12eba221b6ddf3f1430dba" }
extend                   = "1.2.0"
image                    = "0.25.10"
itertools                = "0.15.0"
reqwest                  = "0.13.5"
serde                    = "1.0.229"
serde_json               = "1.0.152"
tokio                    = "1.53.2"
toml                     = "1.1.8"
tracing                  = "0.1.44"
tracing-subscriber       = "0.3.23"
tracing-web              = "0.1.3"
url                      = "2.5.8"
web-sys                  = "0.3.106"
zutil-cloned             = "0.1.0"
zutil-logger             = "0.1.1"

[workspace.lints]

clippy.nursery  = { level = "warn", priority = -1 }
clippy.pedantic = { level = "warn", priority = -1 }

rust.unused_crate_dependencies = "warn"

# This triggers too often in plural forms
clippy.similar_names = "allow"

# Misc.
clippy.match_bool         = "allow"
clippy.missing_panics_doc = "allow"
clippy.option_if_let_else = "allow"
clippy.single_match_else  = "allow"

# Wasm is single-threaded for now
clippy.future_not_send = "allow"
